name: Checkmarx Test on ASoC

on:
pull_request:
push:
branches: [ main ]
workflow_dispatch:

permissions:
contents: read
security-events: write

jobs:
scan:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Run AppScan
    uses: ankurraina66/checkmarx_test@main
    with:
      baseurl: https://cloud.appscan.com
      asoc_key: ${{ secrets.ASOC_KEY }}
      asoc_secret: ${{ secrets.ASOC_SECRET }}
      application_id: e17e1275-c881-43f4-af46-4b4e5c57114f
      dynamic_scan_type: dast
      starting_URL: https://demo.testfire.net?mode=demo
      login_method: userpass
      login_user: jsmith
      login_password: demo1234
      network: public
      wait_for_analysis: true

  - name: Post AppScan PR decoration
    if: github.event_name == 'pull_request'
    uses: actions/github-script@v7
    with:
      script: |
        const fs = require('fs');
        const body = fs.readFileSync('appscan_pr_report.md', 'utf8');

        await github.rest.issues.createComment({
          owner: context.repo.owner,
          repo: context.repo.repo,
          issue_number: context.payload.pull_request.number,
          body: body
        });

  - name: Upload SARIF
    uses: github/codeql-action/upload-sarif@v4
    with:
      sarif_file: appscan-results.sarif
```
