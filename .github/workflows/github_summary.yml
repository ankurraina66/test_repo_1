name: "Build Summary & PR Decoration for HCL AppScan SAST"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Run AppScan SAST scan
        uses: ankurraina66/test_sast_action_orca@main
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: 16574fc8-59c8-4675-ade2-885877e0a392
          wait_for_analysis: true


      - name: Post AppScan PR comment
        if: github.event_name == 'pull_request' && hashFiles('appscan_pr_report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = fs.readFileSync(
              'appscan_pr_report.md',
              'utf8'
            );

            await github.rest.issues.createComment({

              owner:
                context.repo.owner,

              repo:
                context.repo.repo,

              issue_number:
                context.payload.pull_request.number,

              body:
                body

            });


      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('appscan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: appscan-results.sarif
