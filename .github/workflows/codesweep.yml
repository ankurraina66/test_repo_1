name: "HCL AppScan CodeSweep"

on:

  pull_request:

    types: [opened, synchronize, reopened]


permissions:

  contents: read

  pull-requests: write

  issues: write


jobs:

  codesweep:

    runs-on: ubuntu-latest


    steps:

#########################################################
# Checkout
#########################################################

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0


#########################################################
# Run CodeSweep
#########################################################

      - name: Run AppScan CodeSweep

        id: codesweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:

          asoc_key: ${{ secrets.ASOC_KEY }}

          asoc_secret: ${{ secrets.ASOC_SECRET }}

          status: failure

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# Create PR summary comment
#########################################################

      - name: Add CodeSweep summary to PR

        if: always()

        uses: actions/github-script@v7

        with:

          script: |

            const table = `
            ## AppScan CodeSweep Results

            CodeSweep analysis completed.

            View inline findings in the **Files changed** tab.

            Detected issues will appear directly in the diff view as annotations.

            `;


            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.payload.pull_request.number,

              body: table

            });
