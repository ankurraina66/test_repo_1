name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      # -----------------------------------------
      # Checkout repository
      # -----------------------------------------

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -----------------------------------------
      # Run CodeSweep scan
      # -----------------------------------------

      - name: Run AppScan CodeSweep
        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # -----------------------------------------
      # DEBUG STEP → check if SARIF exists
      # -----------------------------------------

      - name: Inspect workspace for SARIF
        run: |

          echo "================================="
          echo "Current directory:"
          pwd

          echo "================================="
          echo "All files in workspace:"
          find . -type f

          echo "================================="
          echo "Searching for SARIF files:"
          find . -name "*.sarif"

          echo "================================="
          echo "Searching for JSON files:"
          find . -name "*.json"

          echo "================================="
          echo "Listing directory tree:"
          ls -R


      # -----------------------------------------
      # Attempt SARIF upload (only if exists)
      # -----------------------------------------

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('**/*.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: '**/*.sarif'
