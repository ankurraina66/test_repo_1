name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# Checkout repository
#########################################################

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


#########################################################
# Run CodeSweep and save SARIF locally
#########################################################

      - name: Run AppScan CodeSweep

        id: codesweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:

          asoc_key: ${{ secrets.ASOC_KEY }}

          asoc_secret: ${{ secrets.ASOC_SECRET }}

          status: failure

          output_file: codesweep.sarif

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# Debug (optional)
#########################################################

      - name: Verify SARIF file exists

        run: |

          echo "checking for sarif"

          ls -la

          if [ -f codesweep.sarif ]; then
            echo "sarif found"
          else
            echo "sarif NOT found"
          fi


#########################################################
# Build PR table from SARIF
#########################################################

      - name: Create CodeSweep PR comment

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require('fs');

            //------------------------------------------------
            // read SARIF generated by CodeSweep
            //------------------------------------------------

            if(!fs.existsSync("codesweep.sarif")){

              console.log("codesweep.sarif not found");

              return;

            }

            const sarif =
              JSON.parse(

                fs.readFileSync(
                  "codesweep.sarif",
                  "utf8"
                )

              );

            const results =
              sarif.runs?.[0]?.results || [];

            if(results.length === 0){

              console.log("no findings");

              return;

            }

            //------------------------------------------------
            // build rows
            //------------------------------------------------

            let rows = "";

            for(const r of results){

              const severity =
                r.properties?.severity
                || r.level
                || "warning";

              const icon =
                severity == "error" ? "🔴" :
                severity == "warning" ? "🟠" :
                "🟡";

              const issueType =
                r.ruleId || "";

              const issueName =
                r.message?.text || "";

              const language =
                r.properties?.language
                || r.properties?.category
                || "";

              const file =
                r.locations?.[0]
                 ?.physicalLocation
                 ?.artifactLocation
                 ?.uri || "";

              const line =
                r.locations?.[0]
                 ?.physicalLocation
                 ?.region
                 ?.startLine || "";

              rows +=
                `| ${icon} | ${issueType} | ${issueName} | ${language} | ${file} | ${line} |\n`;

            }

            //------------------------------------------------
            // markdown comment
            //------------------------------------------------

            const body = `

            # 🔍 AppScan CodeSweep Results

            | Severity | Issue type | Issue name | Language | File | Line |       
            |----------|-----------|-----------|----------|------|------|
            ${rows}

            `;

            //------------------------------------------------
            // create or update PR comment
            //------------------------------------------------

            const owner =
              context.repo.owner;

            const repo =
              context.repo.repo;

            const pr =
              context.payload.pull_request.number;

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: pr

              });

            const existing =
              comments.data.find(

                c =>
                  c.body.includes(
                    "AppScan CodeSweep Results"
                  )

              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

            }

            else{

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: pr,
                body

              });

            }

            console.log("PR table added successfully");
