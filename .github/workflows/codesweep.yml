name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# checkout
#########################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# run codesweep
#########################################################

      - name: Run CodeSweep

        id: scan

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# debug - list files generated
#########################################################

      - name: Debug files

        run: |
          echo "Listing generated files"
          find . -type f | grep -i codesweep || true


#########################################################
# build PR table from CodeSweep JSON
#########################################################

      - name: Create PR table

        uses: actions/github-script@v7

        with:

          script: |

            const fs = require('fs');
            const path = require('path');

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            //--------------------------------------------------
            // search workspace for codesweep result json
            //--------------------------------------------------

            function findFile(dir){

              const files = fs.readdirSync(dir);

              for(const f of files){

                const full =
                  path.join(dir, f);

                if(fs.statSync(full).isDirectory()){

                  const found =
                    findFile(full);

                  if(found)
                    return found;

                }

                if(f.toLowerCase().includes("codesweep")
                   && f.endsWith(".json")){

                  return full;

                }

              }

            }

            const resultFile =
              findFile(process.cwd());

            if(!resultFile){

              console.log("No CodeSweep json found");

              return;

            }

            console.log("Using file:", resultFile);

            //--------------------------------------------------
            // read results
            //--------------------------------------------------

            const data =
              JSON.parse(
                fs.readFileSync(
                  resultFile,
                  "utf8"
                )
              );

            const issues =
              data?.issues
              || data?.results
              || [];

            if(!issues.length){

              console.log("No issues");

              return;

            }

            //--------------------------------------------------
            // build table rows
            //--------------------------------------------------

            let rows = "";

            for(const i of issues){

              const sev =
                i.severity
                || i.level
                || "warning";

              const title =
                i.rule
                || i.title
                || i.name
                || "issue";

              const file =
                i.file
                || i.path
                || "-";

              const line =
                i.line
                || i.startLine
                || "-";

              rows +=
                `| ${sev} | ${title} | ${file} | ${line} |\n`;

            }

            //--------------------------------------------------
            // markdown
            //--------------------------------------------------

            const body = `

            ## 🔍 AppScan CodeSweep Findings

            | Severity | Issue | File | Line |
            |----------|------|------|------|
            ${rows}

            `;

            //--------------------------------------------------
            // update PR comment
            //--------------------------------------------------

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: pr

              });

            const existing =
              comments.data.find(

                c =>
                  c.body.includes(
                    "AppScan CodeSweep Findings"
                  )

              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

            }

            else{

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: pr,
                body

              });

            }

            console.log("PR table created");
