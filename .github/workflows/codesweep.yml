name: "HCL AppScan Full PR Security"

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:

# -----------------------------
# SAST (runs on push + manual)
# -----------------------------

  sast:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AppScan SAST scan
        uses: ankurraina66/test_sast_action_orca@main
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          application_id: 16574fc8-59c8-4675-ade2-885877e0a392
          wait_for_analysis: true


      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('appscan-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: appscan-results.sarif


# -----------------------------
# CodeSweep (runs ONLY on PR)
# -----------------------------

  codesweep:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Run AppScan CodeSweep
        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Post CodeSweep PR guidance comment
        uses: actions/github-script@v7
        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            const diffUrl = `https://github.com/${owner}/${repo}/pull/${pr}/files`;

            const body = `
            🔍 **HCL AppScan CodeSweep detected issues in this PR**

            View findings directly in the PR diff:

            ${diffUrl}

            Issues detected may include:

            • Hardcoded credentials  
            • SQL Injection risks  
            • Weak cryptography  
            • Input validation issues  

            Each issue is shown inline with remediation guidance.
            `;

            //-----------------------------------------
            // avoid duplicate comment
            //-----------------------------------------

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: pr

              });

            const existing =
              comments.data.find(c =>
                c.body.includes("CodeSweep detected issues in this PR")
              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

            } else {

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: pr,
                body

              });

            }
