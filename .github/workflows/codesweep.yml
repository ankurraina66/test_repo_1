name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# Checkout repository
#########################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# Run CodeSweep scan
#########################################################

      - name: Run AppScan CodeSweep
        id: codesweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# wait briefly to allow annotations to register
#########################################################

      - name: Wait for annotations
        run: sleep 20


#########################################################
# Convert annotations into PR table
#########################################################

      - name: Create CodeSweep PR table

        uses: actions/github-script@v7

        with:

          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            //--------------------------------------------------
            // fetch check runs for commit
            //--------------------------------------------------

            const checks = await github.rest.checks.listForRef({
              owner,
              repo,
              ref: sha
            });

            //--------------------------------------------------
            // find codesweep check run
            //--------------------------------------------------

            const codesweepCheck = checks.data.check_runs.find(
              c => c.name.includes("CodeSweep")
            );

            if (!codesweepCheck) {

              console.log("No CodeSweep check found");
              return;

            }

            //--------------------------------------------------
            // fetch annotations
            //--------------------------------------------------

            const annotations = await github.rest.checks.listAnnotations({
              owner,
              repo,
              check_run_id: codesweepCheck.id
            });

            if (!annotations.data.length) {

              console.log("No findings detected");
              return;

            }

            //--------------------------------------------------
            // build markdown table rows
            //--------------------------------------------------

            let rows = "";

            for (const a of annotations.data) {

              const severity = a.annotation_level || "warning";
              const issue = a.title || "Unknown";
              const file = a.path || "-";
              const line = a.start_line || "-";

              rows += "| "
                + severity
                + " | "
                + issue
                + " | "
                + file
                + " | "
                + line
                + " |\n";

            }

            //--------------------------------------------------
            // markdown comment
            //--------------------------------------------------

            const body =
              "## 🔍 HCL AppScan CodeSweep Findings\n\n"
              + "| Severity | Issue | File | Line |\n"
              + "|----------|------|------|------|\n"
              + rows
              + "\n"
              + "Inline annotations are also visible in the **Files changed** tab.\n";


            //--------------------------------------------------
            // update existing PR comment if present
            //--------------------------------------------------

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber
            });

            const existing = comments.data.find(
              c => c.body.includes("HCL AppScan CodeSweep Findings")
            );

            if (existing) {

              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });

            } else {

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });

            }

            console.log("PR table created successfully");
