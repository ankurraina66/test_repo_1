name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# checkout
#########################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# run codesweep
#########################################################

      - name: Run AppScan CodeSweep
        id: scan

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# wait briefly to ensure results available
#########################################################

      - name: Wait for results
        run: sleep 20


#########################################################
# fetch issues from ASoC API
#########################################################

      - name: Get CodeSweep issues

        id: issues

        uses: actions/github-script@v7

        env:
          ASOC_KEY: ${{ secrets.ASOC_KEY }}
          ASOC_SECRET: ${{ secrets.ASOC_SECRET }}

        with:

          script: |

            const got = require("got");

            const baseUrl = "https://cloud.appscan.com/api/v4";


            //---------------------------------------------------
            // login
            //---------------------------------------------------

            const login = await got.post(

              baseUrl + "/Account/ApiKeyLogin",

              {

                json: {

                  keyId: process.env.ASOC_KEY,

                  keySecret: process.env.ASOC_SECRET,

                  clientType: "codesweep-github"

                }

              }

            ).json();


            const token = login.token;


            //---------------------------------------------------
            // get latest scan
            //---------------------------------------------------

            const scans = await got.get(

              baseUrl + "/Scans?$top=1",

              {

                headers: {

                  Authorization: "Bearer " + token

                }

              }

            ).json();


            const scanId = scans.Items[0].Id;


            //---------------------------------------------------
            // get issues
            //---------------------------------------------------

            const issues = await got.get(

              baseUrl + "/Issues/Scan/" + scanId + "?applyPolicies=None",

              {

                headers: {

                  Authorization: "Bearer " + token

                }

              }

            ).json();


            return issues.Items;


#########################################################
# create PR table
#########################################################

      - name: Create PR table

        uses: actions/github-script@v7

        with:

          script: |

            const issues = ${{ steps.issues.outputs.result }};


            if(!issues || issues.length === 0){

              console.log("no issues found");

              return;

            }


            let rows = "";


            for(const i of issues){

              rows += `

              | ${i.Severity} | ${i.IssueType} | ${i.File} | ${i.Line} |

              `;

            }


            const table = `

            ## 🔍 AppScan CodeSweep Findings


            | Severity | Issue | File | Line |

            |----------|------|------|------|

            ${rows}


            `;


            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.payload.pull_request.number,

              body: table

            });
