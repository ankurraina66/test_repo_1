name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:

      #--------------------------------------------
      # Checkout repository with full history
      #--------------------------------------------

      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      #--------------------------------------------
      # Run CodeSweep scan
      #--------------------------------------------

      - name: Run AppScan CodeSweep
        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2
        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      #--------------------------------------------
      # Wait + build PR table from GitHub alerts
      #--------------------------------------------

      - name: Generate PR table from CodeSweep findings
        uses: actions/github-script@v7
        with:
          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            //------------------------------------------------
            // wait until GitHub registers CodeSweep findings
            //------------------------------------------------

            let alerts = [];
            let attempts = 0;

            while(alerts.length === 0 && attempts < 10){

              console.log("Waiting for GitHub to register CodeSweep findings...");

              await new Promise(r => setTimeout(r, 15000));

              const response =
                await github.rest.codeScanning.listAlertsForRepo({

                  owner,
                  repo,
                  state: "open",
                  per_page: 100

                });

              alerts = response.data;

              attempts++;

            }

            console.log(`Total alerts available: ${alerts.length}`);

            //------------------------------------------------
            // get files changed in PR
            //------------------------------------------------

            const prFiles =
              await github.rest.pulls.listFiles({

                owner,
                repo,
                pull_number: pr

              });

            const changedFiles =
              prFiles.data.map(f => f.filename);

            console.log("Files changed in PR:", changedFiles);

            //------------------------------------------------
            // filter alerts belonging only to PR files
            //------------------------------------------------

            const findings =
              alerts.filter(a =>
                changedFiles.includes(
                  a.most_recent_instance.location.path
                )
              );

            console.log(`Findings for PR: ${findings.length}`);

            if(findings.length === 0){

              console.log("No CodeSweep findings for this PR");
              return;

            }

            //------------------------------------------------
            // build markdown table
            //------------------------------------------------

            let rows = "";

            for(const f of findings){

              const sev =
                f.rule.severity === "error"
                ? "🔴 High"
                : f.rule.severity === "warning"
                ? "🟡 Medium"
                : "⚪ Low";

              rows +=
              `| ${sev} | ${f.rule.id} | ${f.most_recent_instance.location.path} | ${f.most_recent_instance.location.start_line} |
              `;

            }

            //------------------------------------------------
            // final PR comment
            //------------------------------------------------

            const body =
`
            ## 🔍 HCL AppScan CodeSweep Findings

            | Severity | Issue | File | Line |
            |----------|------|------|------|
            ${rows}

            View findings inline in PR diff for full remediation guidance.
            `;

            //------------------------------------------------
            // update existing comment if present
            //------------------------------------------------

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: pr

              });

            const existing =
              comments.data.find(c =>
                c.body.includes("HCL AppScan CodeSweep Findings")
              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

              console.log("Updated existing PR comment");

            } else {

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: pr,
                body

              });

              console.log("Created new PR comment");

            }
