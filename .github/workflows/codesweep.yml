name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: read
  pull-requests: write
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# checkout repo
#########################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# run codesweep scan
#########################################################

      - name: Run AppScan CodeSweep
        id: codesweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# wait to ensure annotations available
#########################################################

      - name: wait for annotations
        run: sleep 25


#########################################################
# create PR table
#########################################################

      - name: Create PR comment table

        uses: actions/github-script@v7

        with:

          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;

            //---------------------------------------------
            // fetch all check runs for commit
            //---------------------------------------------

            const checks = await github.rest.checks.listForRef({

              owner,
              repo,
              ref: sha

            });

            //---------------------------------------------
            // find CodeSweep check
            //---------------------------------------------

            const codesweepCheck =
              checks.data.check_runs.find(

                c => c.name.toLowerCase().includes("codesweep")

              );

            if(!codesweepCheck){

              console.log("codesweep check not found");
              return;

            }

            //---------------------------------------------
            // get annotations
            //---------------------------------------------

            const annotations =
              await github.rest.checks.listAnnotations({

                owner,
                repo,
                check_run_id: codesweepCheck.id

              });

            if(!annotations.data.length){

              console.log("no findings found");
              return;

            }

            //---------------------------------------------
            // build markdown table
            //---------------------------------------------

            let rows = "";

            for(const a of annotations.data){

              const severity = a.annotation_level || "warning";

              const title = a.title || "issue";

              const file = a.path || "-";

              const line = a.start_line || "-";

              rows +=
                "| " + severity
                + " | "
                + title
                + " | "
                + file
                + " | "
                + line
                + " |\n";

            }

            const body =
              "## 🔍 HCL AppScan CodeSweep Findings\n\n"
              + "| Severity | Issue | File | Line |\n"
              + "|----------|------|------|------|\n"
              + rows
              + "\n"
              + "Inline results are also visible in the Files changed tab.\n";


            //---------------------------------------------
            // create or update PR comment
            //---------------------------------------------

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: prNumber

              });

            const existing =
              comments.data.find(

                c =>
                  c.body.includes(
                    "HCL AppScan CodeSweep Findings"
                  )

              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

            }

            else{

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: prNumber,
                body

              });

            }

            console.log("PR table created successfully");
