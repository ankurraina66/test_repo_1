name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: read
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# run codesweep
#########################################################

      - name: Run AppScan CodeSweep
        id: codesweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# read annotations and create PR table
#########################################################

      - name: Convert findings to PR table

        uses: actions/github-script@v7

        with:

          script: |

            //--------------------------------------------------
            // get check runs for this commit
            //--------------------------------------------------

            const checks = await github.rest.checks.listForRef({

              owner: context.repo.owner,

              repo: context.repo.repo,

              ref: context.payload.pull_request.head.sha

            });


            //--------------------------------------------------
            // find codesweep check
            //--------------------------------------------------

            const cs = checks.data.check_runs.find(

              c => c.name.includes("CodeSweep")

            );


            if(!cs){

              console.log("no codesweep check found");

              return;

            }


            //--------------------------------------------------
            // get annotations
            //--------------------------------------------------

            const annotations = await github.rest.checks.listAnnotations({

              owner: context.repo.owner,

              repo: context.repo.repo,

              check_run_id: cs.id

            });


            if(!annotations.data.length){

              console.log("no findings");

              return;

            }


            //--------------------------------------------------
            // build markdown table
            //--------------------------------------------------

            let rows = "";


            for(const a of annotations.data){

              rows += `

              | ${a.annotation_level} | ${a.title} | ${a.path} | ${a.start_line} |

              `;

            }


            const table = `

            ## 🔍 AppScan CodeSweep Findings


            | Severity | Issue | File | Line |

            |----------|------|------|------|

            ${rows}


            `;


            //--------------------------------------------------
            // post PR comment
            //--------------------------------------------------

            await github.rest.issues.createComment({

              owner: context.repo.owner,

              repo: context.repo.repo,

              issue_number: context.payload.pull_request.number,

              body: table

            });
