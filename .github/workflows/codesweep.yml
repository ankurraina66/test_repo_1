name: "HCL AppScan CodeSweep"

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: read
  pull-requests: write
  issues: write

jobs:

  codesweep:

    runs-on: ubuntu-latest

    steps:

#########################################################
# checkout
#########################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


#########################################################
# run codesweep
#########################################################

      - name: Run AppScan CodeSweep

        uses: HCL-TECH-SOFTWARE/appscan-codesweep-action@v2

        with:
          asoc_key: ${{ secrets.ASOC_KEY }}
          asoc_secret: ${{ secrets.ASOC_SECRET }}
          status: failure

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


#########################################################
# wait for GitHub to register results
#########################################################

      - name: wait for results
        run: sleep 40


#########################################################
# create PR table from GitHub Code Scanning alerts
#########################################################

      - name: Create PR table

        uses: actions/github-script@v7

        with:

          script: |

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request.number;

            //--------------------------------------------
            // get code scanning alerts for this PR
            //--------------------------------------------

            const alerts =
              await github.rest.codeScanning.listAlertsForRepo({

                owner,
                repo,
                state: "open"

              });

            if(!alerts.data.length){

              console.log("no alerts found");
              return;

            }

            //--------------------------------------------
            // build table rows
            //--------------------------------------------

            let rows = "";

            for(const a of alerts.data){

              const severity =
                a.rule.security_severity_level
                || a.rule.severity
                || "warning";

              const title =
                a.rule.description
                || a.rule.name;

              const file =
                a.most_recent_instance
                 ?.location
                 ?.path
                 || "-";

              const line =
                a.most_recent_instance
                 ?.location
                 ?.start_line
                 || "-";

              rows +=
                `| ${severity} | ${title} | ${file} | ${line} |\n`;

            }

            const body = `

            ## 🔍 AppScan CodeSweep Findings

            | Severity | Issue | File | Line |
            |----------|------|------|------|
            ${rows}

            `;

            //--------------------------------------------
            // create or update comment
            //--------------------------------------------

            const comments =
              await github.rest.issues.listComments({

                owner,
                repo,
                issue_number: pr

              });

            const existing =
              comments.data.find(

                c =>
                  c.body.includes(
                    "AppScan CodeSweep Findings"
                  )

              );

            if(existing){

              await github.rest.issues.updateComment({

                owner,
                repo,
                comment_id: existing.id,
                body

              });

            }

            else{

              await github.rest.issues.createComment({

                owner,
                repo,
                issue_number: pr,
                body

              });

            }
